server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json;
    gzip_min_length 1024;

    # index.html nunca se cachea: si no, tras un despliegue el navegador
    # seguiria pidiendo los bundles viejos.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Solo /assets/ lleva hash en el nombre (lo genera Vite), asi que solo eso
    # se cachea para siempre. Lo de public/ (favicon, manifest...) no tiene hash.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback de SPA: react-router usa rutas reales (/login, /tasks...).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
